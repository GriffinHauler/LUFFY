name: read-files

on:
  push:
    branches:
      - tmp-read-files

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pushed README on dev
        run: |
          echo "=====DEV_README_HASH_BEGIN====="
          git show origin/dev:README.md | sha256sum
          git show origin/dev:README.md | wc -c
          echo "=====DEV_README_HASH_END====="
          echo "=====README_TODO_SECTION_BEGIN====="
          git show origin/dev:README.md | sed -n '/### 📝 Complete TODO List/,/## 🤝 Contributing/p'
          echo "=====README_TODO_SECTION_END====="
          echo "=====ALL_DONE====="
